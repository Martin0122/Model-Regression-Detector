[tool.ruff]
line-length = 100
target-version = "py311"   # matches CI and the container, not the local interpreter

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplification
]

[tool.ruff.lint.per-file-ignores]
# Inline HTML template - wrapping these lines makes the markup harder to read, not easier.
"src/report.py" = ["E501"]
