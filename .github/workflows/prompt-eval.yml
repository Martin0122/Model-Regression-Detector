name: Prompt Regression Eval

on:
  pull_request:
    paths:
      - "prompts/**"
      - "datasets/**"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/prompt-eval.yml"

jobs:
  # Fast, free, no API key. Runs on every PR and gates the expensive job below.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format check
        run: |
          ruff check src/ tests/ datasets/
          ruff format --check src/ tests/ datasets/

      - name: Validate golden dataset
        run: python datasets/validate_golden_dataset.py

      - name: Unit tests
        run: pytest -q

  # Costs real money (one OpenAI call per case plus one judge call per case), so it only
  # runs once the free checks pass.
  eval:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed fallback summary
        run: |
          mkdir -p reports
          echo "## Eval pipeline result: FAILED" > reports/pipeline_summary.md
          echo "" >> reports/pipeline_summary.md
          echo "The pipeline crashed before it could finish. Check the **Run eval pipeline** step logs." >> reports/pipeline_summary.md

      - name: Run eval pipeline
        id: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BLOCK_ON_CRITICAL_DRIFT: ${{ vars.BLOCK_ON_CRITICAL_DRIFT || 'false' }}
          # Absolute quality floor. Set below the current pass rate deliberately: a floor above
          # it fails every PR regardless of the change under review. Raise it as v3 stabilises -
          # it is a ratchet, not a target.
          MIN_PASS_RATE: ${{ vars.MIN_PASS_RATE || '0.75' }}
        run: python -m src.pipeline

      - name: Find previous eval comment
        if: always()
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Eval pipeline result"

      - name: Comment PR with eval summary
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: reports/pipeline_summary.md
          edit-mode: replace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            reports/*.html
            reports/pipeline_summary.md
          if-no-files-found: warn
